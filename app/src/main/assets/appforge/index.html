<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AppForge Offline</title>
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e13;--fg:#f1f2f6;--card:#1b1d26;--mut:#8b90a0;--ln:#2a2d3a}}

html,body{height:100%}*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:860px;margin:auto;padding:14px}h1{font-size:24px;margin:8px 0}h3{margin-bottom:8px;font-size:15px}p{color:var(--mut)}
.bt,.gh,.kb{border-radius:var(--r);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent}
.bt{background:var(--ac);color:#fff}.gh{background:transparent;color:inherit;border-color:var(--ln)}.gh.on{background:var(--ac);color:#fff}.kb{background:var(--card);color:inherit;border-color:var(--ln);font-size:20px;padding:14px}
input,textarea,select{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;margin:3px 0}input[type=range]{padding:0}input[type=color]{height:40px;padding:2px}

.cols{display:flex;gap:14px;flex-wrap:wrap}.col{flex:1 1 320px;min-width:0}.sticky{position:sticky;top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .gh{padding:7px 10px;font-size:13px}
.lg{display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac),#000 35%))}.lg.round{border-radius:28%}.lg.circle{border-radius:50%}.lg.square{border-radius:6px}.lg.flat{background:var(--ac);border-radius:28%}.lg img{width:100%;height:100%;object-fit:cover}
.ph{width:min(100%,390px);height:min(780px,calc(100dvh - 76px));margin:8px auto;border-radius:34px;border:6px solid #111;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 12px 40px #0004}
.ph.pv{height:540px}.sb{display:flex;justify-content:space-between;padding:8px 20px 4px;font-size:12px;font-weight:700}.scr{flex:1;overflow:auto;position:relative}
.hh{text-align:center;padding:22px 12px 4px;display:grid;justify-items:center;gap:4px}.hh p{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(var(--gc,4),1fr);gap:16px 4px;padding:16px 10px}.ap{text-align:center;font-size:11px;background:none;border:0;color:inherit;cursor:pointer}
.ap .ic{font-size:26px;width:56px;height:56px;border-radius:calc(var(--r)*1.2);display:grid;place-items:center;margin:0 auto 4px;background:var(--card);border:1px solid var(--ln)}
.tb{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--ln);font-weight:700;position:sticky;top:0;background:var(--bg);z-index:3}.bd{padding:12px}
.disp{font-size:34px;text-align:right;padding:14px;min-height:70px;word-break:break-all;background:var(--card);border-radius:var(--r);margin-bottom:8px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.kp .kb:last-child{background:var(--ac);color:#fff}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--card);border:1px solid var(--ln);width:fit-content}.msg.me{margin-left:auto;background:var(--ac);color:#fff;border-color:transparent}
.ov{position:absolute;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;padding:12px}
.hb{padding:4px 0 6px;display:flex;justify-content:center}.hb button{width:120px;height:18px;border:0;padding:0;cursor:pointer;background:linear-gradient(var(--mut),var(--mut)) center/100% 4px no-repeat;border-radius:2px}.si{width:1em;height:1em;vertical-align:-.14em;flex:none}.top{max-width:420px;margin:6px auto 0;padding:0 8px}canvas{max-width:100%}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .gh{flex:1}small{color:var(--mut)}label{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.kiosk .top{display:none}@media(max-width:520px){.kiosk .ph{width:100%;height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none}}
#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:24px;font-family:system-ui,sans-serif}#pr td,#pr th{border-bottom:1px solid #ccc;padding:6px;text-align:left}}
</style></head><body><div id="root"></div>
<script id=engine>
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=$('#root'),S=(a,k,d)=>L(`d_${a.id}_${k}`,d),P=(a,k,v)=>W(`d_${a.id}_${k}`,v);
let apps=L('af_apps',[]),K=[],ex=()=>{};
const MODS={calc:['🧮','Calculator'],notes:['📝','Notes'],ai:['🤖','AI Chat'],trade:['📈','Markets'],music:['🎵','Music'],web:['🌐','Browser'],photo:['🖼️','Media Editor'],avatar:['🧑‍🎤','Avatar'],game:['🐍','Snake'],wallet:['💳','Wallet'],phone:['📞','Phone'],social:['💬','Social'],tools:['🧰','Smart Tools'],todo:['✅','To-Do'],expenses:['💰','Budget'],draw:['🎨','Sketchpad'],habits:['📅','Habits'],calendar:['📆','Calendar'],clock:['⏰','Clock'],camera:['📷','Camera'],recorder:['🎙','Recorder'],mail:['✉','Mail'],cards:['🃏','Flashcards'],sheets:['📊','Sheets'],code:['💻','Code Lab'],vault:['🔒','Vault'],ttt:['⭕','Tic-Tac-Toe']};
const ICONS=['🚀','⚡','🌍','🔥','💎','🎯','🛰️','🧠','🦅','🌈','🏦','🎮'],COL=['#6c5ce7','#0984e3','#00b894','#e17055','#d63031','#e84393','#fdcb6e','#2d3436'];
const TPL={'Super App':Object.keys(MODS),'Fintech':['wallet','trade','calc','tools'],'Social':['social','photo','avatar','ai'],'Media':['music','photo','web'],'Games':['game','avatar','music'],'Phone':['phone','notes','calc','web','tools'],'Productivity':['todo','habits','expenses','notes','draw'],'Office':['mail','calendar','sheets','notes','todo','clock'],'Creator':['camera','recorder','photo','draw','code','music']};
const FONTS=['system-ui,sans-serif','Georgia,serif','ui-monospace,Menlo,monospace'],WPS=['none','linear-gradient(160deg,color-mix(in srgb,var(--ac) 40%,var(--bg)),var(--bg) 70%)','linear-gradient(200deg,#0f2027,#2c5364);color:#fff','linear-gradient(160deg,#f6d365,#fda085);color:#222'];
const pal=a=>{const d=a.theme=='dark'||(a.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);return `--bg:${d?'#0d0e13':'#f3f4f8'};--fg:${d?'#f1f2f6':'#14151a'};--card:${d?'#1b1d26':'#fff'};--mut:${d?'#8b90a0':'#737888'};--ln:${d?'#2a2d3a':'#e2e4ec'};--ac:${a.color};--r:${a.r}px;font-family:${a.ff||FONTS[a.font]};font-size:${15*(a.fs||1)}px;--gc:${a.gc||4}`};
const logo=(a,s=56)=>`<div class="lg ${a.shape}" style="width:${s}px;height:${s}px;font-size:${s*.55}px;--ac:${a.color}">${a.logo?`<img src="${a.logo}" alt="">`:a.icon}</div>`;
const homeHTML=a=>`<div class=hh>${logo(a,72)}<h2>${esc(a.name)}</h2><p>${esc(a.tag)}</p></div><div class=cd style="margin:10px 12px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:30px;font-weight:700">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><small>${new Date().toDateString()}</small></div><small style="text-align:right">Offline mode<br>Data stays on device</small></div><div class=grid>${a.mods.map(m=>`<button class=ap data-o="${m}"><div class=ic>${MODS[m][0]}</div>${MODS[m][1]}</button>`).join('')}${(a.screens||[]).map((s,i)=>`<button class=ap data-o="scr:${i}"><div class=ic>📱</div>${esc(s.name)}</button>`).join('')}<button class=ap data-o=about><div class=ic>ℹ️</div>About</button><button class=ap data-o=set><div class=ic>⚙️</div>Settings</button></div>`;
const phoneHTML=(a,pv)=>`<div class="ph ${pv?'pv':''}" style="${pal(a)}"><style>@scope(.ph){${String(a.css||'').replace(/<\/style/gi,'')}}</style><div class=sb><b class=clk>${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</b><span>5G 📶 🔋</span></div><div class=scr id=scr style="background:${WP(a)}">${homeHTML(a)}</div><div class=hb><button data-hm></button></div></div>`;
const wpFix=a=>{};

/* ---------- HOME ---------- */
function home(){let del='';ex();ex=()=>{};
root.innerHTML=`<div class=wrap><h1>⚒️ AppForge</h1><p>Build real-looking apps inside this app. 100% offline, nothing leaves your device.</p>
<div class=cd><h3>Quick start</h3><div class=chips>${Object.keys(TPL).map(t=>`<button class=gh data-t="${t}">${t}</button>`).join('')}<button class=gh data-t="">Blank</button></div></div>
<div class=cd><h3>Share / import</h3><textarea id=ix rows=2 placeholder="Export puts the app code here. Paste a code here to import an app."></textarea><button class=gh data-im>Import app</button></div><div class=row><h3>My apps (${apps.length})</h3><button class=bt data-n>＋ New app</button></div>
${apps.length?apps.map((a,i)=>`<div class="cd row"><div class=row style="gap:12px">${logo(a,48)}<div><b>${esc(a.name)}</b><br><small>${a.mods.length} features</small></div></div><span><button class=bt data-r=${i}>Open</button> <button class=gh data-e=${i}>Edit</button> <button class=gh data-ex=${i}>Export</button> <button class=gh data-d=${i}>🗑</button></span></div>`).join(''):'<div class=cd><p>No apps yet. Pick a quick start above.</p></div>'}</div>`;
root.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.t!==undefined)builder(null,d.t);else if('n'in d)builder(null,'');else if(d.r)run(apps[d.r]);else if(d.e)builder(apps[d.e]);else if(d.ex){$('#ix').value=JSON.stringify(apps[d.ex])}else if('im'in d){try{const o=JSON.parse($('#ix').value);o.id=Date.now()+'';if(o.name&&o.mods){apps.push(o);W('af_apps',apps)}home()}catch(_){$('#ix').value='Invalid app code'}}else if(d.d){if(b.textContent=='Sure?'){apps.splice(d.d,1);W('af_apps',apps);home()}else b.textContent='Sure?'}};
root.oninput=root.onchange=null}

/* ---------- BUILDER ---------- */
function builder(a,t){const d=a?JSON.parse(JSON.stringify(a)):{id:Date.now()+'',name:'My App',tag:'Built offline',about:'',icon:'🚀',shape:'round',logo:'',color:'#6c5ce7',theme:'auto',r:16,font:0,wp:1,mods:t?[...TPL[t]]:['calc','notes','ai'],screens:[{name:'Counter',items:[{t:'head',v:'Welcome',x:'',y:''},{t:'text',v:'You tapped {count} times',x:'',y:''},{t:'btn',v:'Tap me',x:'count=count+1',y:'set'}]}]};
d.screens=d.screens||[];window.__D=d;const upd=()=>{$('#pv').innerHTML=phoneHTML(d,1)};
root.innerHTML=`<div class=wrap><div class=row><button class=gh data-x=bk>← Back</button><button class=bt data-x=sv>Save &amp; open</button></div><h1>${a?'Edit':'Create'} app</h1><div class=cols><div class=col>
<div class=cd><h3>Basics</h3><input data-k=name value="${esc(d.name)}" placeholder="App name"><input data-k=tag value="${esc(d.tag)}" placeholder="Tagline"><textarea data-k=about rows=3 placeholder="About / what this app does">${esc(d.about)}</textarea><input data-k=pin value="${esc(d.pin||'')}" maxlength=4 inputmode=numeric placeholder="App lock PIN (optional, 4 digits)"></div>
<div class=cd><h3>Logo &amp; icon</h3><div class=chips>${ICONS.map(i=>`<button class=gh data-ic="${i}">${i}</button>`).join('')}</div><label>Icon style</label><div class=chips>${['round','circle','square','flat'].map(s=>`<button class=gh data-sh=${s}>${s}</button>`).join('')}</div><label>Or upload your own logo</label><input type=file id=lf accept="image/*"><button class=gh data-x=rl style="margin-top:6px">Remove uploaded logo</button></div>
<div class=cd><h3>Appearance</h3><label>Accent colour</label><div class=chips>${COL.map(c=>`<button class=gh data-co=${c} style="background:${c};width:34px;height:34px;padding:0"></button>`).join('')}<input type=color data-k=color value="${d.color}" style="width:60px"></div>
<label>Theme</label><select data-k=theme>${['auto','light','dark'].map(x=>`<option ${d.theme==x?'selected':''}>${x}</option>`).join('')}</select><label>Corner roundness</label><input type=range data-k=r min=2 max=28 value=${d.r}>
<label>Font</label><select data-k=font>${['Modern','Serif','Mono'].map((x,i)=>`<option value=${i} ${d.font==i?'selected':''}>${x}</option>`).join('')}</select><label>Wallpaper</label><select data-k=wp>${['None','Accent glow','Ocean','Sunset'].map((x,i)=>`<option value=${i} ${d.wp==i?'selected':''}>${x}</option>`).join('')}</select></div>
<div class=cd><h3>Screen designer</h3><p style="margin-bottom:8px;font-size:13px">Design your own screens: text, buttons, inputs, switches, lists, images, with logic.</p><div id=sc></div></div><div class=cd><h3>What it does (features)</h3><div class=chips style="margin-bottom:8px">${Object.keys(TPL).map(x=>`<button class=gh data-t="${x}">${x}</button>`).join('')}</div><div class=chips id=mods>${Object.entries(MODS).map(([k,v])=>`<button class="gh ${d.mods.includes(k)?'on':''}" data-m=${k}>${v[0]} ${v[1]}</button>`).join('')}</div></div></div>
<div class=col><div class=sticky><p style="text-align:center">Live preview</p><div id=pv></div></div></div></div></div>`;upd();
const TT={head:'Heading',text:'Text',btn:'Button',input:'Input',switch:'Switch',list:'List',img:'Image',div:'Divider',slider:'Slider',select:'Dropdown',progress:'Progress',html:'Custom HTML/JS'};
const EX0=(it,s,i)=>{const A=`data-s=${s} data-i=${i}`;return it.t=='btn'?`<select ${A} data-f=y>${['alert','go','set','open','back','reset'].map(o=>`<option ${it.y==o?'selected':''}>${o}</option>`).join('')}</select><input ${A} data-f=x value="${esc(it.x)}" placeholder="message / screen name / var=expr / feature key">`:it.t=='input'||it.t=='switch'?`<input ${A} data-f=x value="${esc(it.x)}" placeholder="variable name">`:it.t=='list'?`<input ${A} data-f=y value="${esc(it.y)}" placeholder="Item 1, Item 2, Item 3"><input ${A} data-f=x value="${esc(it.x)}" placeholder="variable for selection">`:it.t=='slider'?`<input ${A} data-f=x value="${esc(it.x)}" placeholder="variable"><input ${A} data-f=y value="${esc(it.y)}" placeholder="min,max e.g. 0,100">`:it.t=='select'?`<input ${A} data-f=y value="${esc(it.y)}" placeholder="Option A, Option B"><input ${A} data-f=x value="${esc(it.x)}" placeholder="variable">`:it.t=='html'?`<input ${A} data-f=y value="${esc(it.y)}" placeholder="Height in px (default 320)">`:it.t=='progress'?`<input ${A} data-f=x value="${esc(it.x)}" placeholder="variable (0-100)">`:''};
const EX=(it,s,i)=>EX0(it,s,i)+(it.t=='div'?'':`<input data-s=${s} data-i=${i} data-f=c value="${esc(it.c||'')}" placeholder="Show only if… e.g. count>3">`);
const dsg=()=>{$('#sc').innerHTML=d.screens.map((s,si)=>`<div class=cd><div class=row><input data-sn=${si} value="${esc(s.name)}"><button class=gh data-ds=${si}>🗑</button></div><div class=chips>${Object.entries(TT).map(([k,n])=>`<button class=gh data-ad="${si}:${k}">＋ ${n}</button>`).join('')}</div>${s.items.map((it,i)=>`<div class=row style="gap:4px;margin-top:8px;align-items:start"><div style="flex:1"><small>${TT[it.t]}</small>${it.t=='div'?'':it.t=='img'?`<input type=file accept="image/*" data-im="${si}:${i}">`:it.t=='html'?`<textarea data-s=${si} data-i=${i} data-f=v rows=8 style="font-family:monospace;font-size:12px" placeholder="Write any HTML, CSS and JavaScript here. It runs as a mini web page.">${esc(it.v)}</textarea>`:`<input data-s=${si} data-i=${i} data-f=v value="${esc(it.v)}" placeholder="Text, use {variable}">`}${EX(it,si,i)}</div><span><button class=gh data-mv="${si}:${i}:-1">↑</button><button class=gh data-mv="${si}:${i}:1">↓</button><button class=gh data-del="${si}:${i}">✕</button></span></div>`).join('')}</div>`).join('')+`<button class=bt data-sa>＋ New screen</button>`};
dsg();root.oninput=ev=>{const t=ev.target,D=t.dataset;if(D.f!==undefined){d.screens[D.s].items[D.i][D.f]=t.value;return}if(D.sn!==undefined){d.screens[D.sn].name=t.value;upd();return}const k=D.k;if(!k)return;d[k]=['r','font','wp'].includes(k)?+t.value:t.value;upd()};
root.onchange=ev=>{const T=ev.target;if(T.dataset.im&&T.files[0]){const[s,i]=T.dataset.im.split(':'),im=new Image(),u=URL.createObjectURL(T.files[0]);im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,400/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.screens[s].items[i].v=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(u)};im.src=u;return}if(ev.target.id!='lf'||!ev.target.files[0])return;const im=new Image(),u=URL.createObjectURL(ev.target.files[0]);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);d.logo=c.toDataURL('image/png');URL.revokeObjectURL(u);upd()};im.src=u};
root.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const q=b.dataset;{const sp=n=>(q[n]||'').split(':');if('sa'in q){d.screens.push({name:'Screen '+(d.screens.length+1),items:[]});upd();return dsg()}if(q.ds){d.screens.splice(q.ds,1);upd();return dsg()}if(q.ad){const[s,t]=sp('ad');d.screens[s].items.push({t,v:t=='btn'?'Button':t=='div'?'':'Text',x:'',y:t=='btn'?'alert':''});return dsg()}if(q.del){const[s,i]=sp('del');d.screens[s].items.splice(i,1);return dsg()}if(q.mv){const[s,i,k]=sp('mv'),it=d.screens[s].items,j=+i+ +k;if(j>=0&&j<it.length){[it[i],it[j]]=[it[j],it[i]];dsg()}return}}
if(q.ic){d.icon=q.ic;d.logo=''}else if(q.sh)d.shape=q.sh;else if(q.co)d.color=q.co;
else if(q.m){const i=d.mods.indexOf(q.m);i<0?d.mods.push(q.m):d.mods.splice(i,1);b.classList.toggle('on')}
else if(q.t!==undefined){d.mods=[...TPL[q.t]];document.querySelectorAll('#mods button').forEach(x=>x.classList.toggle('on',d.mods.includes(x.dataset.m)))}
else if(q.x=='rl')d.logo='';else if(q.x=='bk')return home();
else if(q.x=='sv'){d.name=d.name.trim()||'My App';const i=apps.findIndex(x=>x.id==d.id);i<0?apps.push(d):apps[i]=d;W('af_apps',apps);return run(d)}
upd()}}

/* ---------- RUNTIME ---------- */
function run(a){const keep=K;ex();root.oninput=root.onchange=null;
root.innerHTML=`<div class=top><button class=gh data-x>← Exit app</button></div>${phoneHTML(a)}`;
const iv=setInterval(()=>{const c=$('.clk');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},20000);
const z=f=>K.push(f),clean=()=>{K.forEach(f=>{try{f()}catch(e){}});K=[]},scr=$('#scr');
const goHome=()=>{clean();scr.style.cssText='background:'+WP(a);scr.innerHTML=homeHTML(a)};
ex=()=>{clean();clearInterval(iv);document.querySelectorAll('.ov').forEach(x=>x.remove())};
