name: Build EKPE APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Chaquopy (the on-device Python used by EKPE Intel / Script Lab) needs a build-time Python 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "## Compile errors" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -80 >> $GITHUB_STEP_SUMMARY
          grep -E "^e: " build.log | head -40
          exit $code
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/*.apk EKPE.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: EKPE-apk
          path: EKPE.apk
